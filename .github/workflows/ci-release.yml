name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        #name: Rainstrap (Release) (${{ github.sha }})
        path: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Rainstrap.exe
        archive: false

  release:
    needs: build
    runs-on: ubuntu-latest
    # Retired in favour of release.yml ("Build release").
    #
    # This job published a framework-dependent, English-only exe: PublishSingleFile drops
    # every satellite assembly, and --self-contained false means the exe needs the .NET 6
    # Desktop Runtime installed. It also could not attach a build to a release that had
    # already been published, which is why the v1.0.0 release ended up with no assets.
    #
    # Kept but disabled rather than deleted, so it is easy to restore.
    if: false
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        #with:
        #  name: Rainstrap (Release) (${{ github.sha }})
        #  path: release

      #- name: Rename binaries
      #  run: mv release/Rainstrap.exe Rainstrap.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: Rainstrap.exe
          name: Rainstrap ${{ github.ref_name }}
          fail_on_unmatched_files: true

  release-test:
    needs: build
    runs-on: ubuntu-latest
    # Retired for the same reason as the release job above; see release.yml.
    if: false
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        #with:
        #  name: Rainstrap (Release) (${{ github.sha }})
        #  path: release

      #- name: Rename binaries
      #  run: mv release/Rainstrap.exe Rainstrap.exe

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: Rainstrap.exe
          name: Rainstrap ${{ github.ref_name }}
          fail_on_unmatched_files: true
