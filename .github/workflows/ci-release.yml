name: CI (Release)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"

  pull_request:

  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and attach Rainstrap.exe to (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: rainstrap-release-${{ github.sha }}
          path: .\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Rainstrap.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''

    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: rainstrap-release-${{ github.sha }}
          path: release

      - name: Verify executable exists
        shell: bash
        run: |
          if [ ! -f release/Rainstrap.exe ]; then
            echo "::error::Rainstrap.exe not found in downloaded artifact"
            exit 1
          fi
          ls -l release/Rainstrap.exe

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/Rainstrap.exe
          name: Rainstrap ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true